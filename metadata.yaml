name: astrbot_plugin_signin
display_name: 签到娱乐系统
desc: 群签到 + 左轮手枪 + 宠物养成 + 金币银行 + 农场插件：签到/打工/玩耍/商店/存款生息/种植收割/金币红包/活动中心/排行榜，含 WebUI 配置页与后台管理页；2.0.4：自动购买重做（原自动喂养）：触发判定改为 饱食/口渴/心情/健康 任一属性进入第 3/4 档时自动触发，按 饱食→口渴→心情→健康 顺序补满且道具数量最少化（如缺口 120 用 3 个 +40 而非 12 个 +10，先仓库免费后购买，购买为实时价×可调倍率），购买/使用记录带数量标记（🛒/📦 ×N）；新增自动打工（开启自动购买自动开启，也可「自动打工 开/关」单独控制，未开自动购买不允许开）：自动购买消耗金币记入打工基准金币、自动选择报酬最接近基准的打工项目、只给金币不给经验、报酬溢出计入基准、基准≤100 暂停（下次自动购买超过后恢复）、独立计时器（冷却结束+可调分钟后再安排下一次，循环往复）；商店价格浮动逻辑更改：价格固定偶数点刷新（0/2/4/…/22 整点、同 2 小时窗口稳定）、特价时段（10/12/18/0 时窗口）随机选取 2~5 件商品打 二~八折（倍率 0.2~0.8 可调）、其余时段全部商品回原价、购买按实时价结算、价格变动可在 WebUI「运行记录 → 商店价格」查看；WebUI 新增「运行记录」页（首页新卡片）：宠物记录（全部宠物卡片：当前状态/正在进行的活动/自动购买·自动打工信息与基准）+ 商店价格（最近价格变动记录）；2.0.3：新增「修改昵称 <任意字符>」自定义昵称（90 天有效、优先级高于获取的昵称，各响应统一使用）；金币账单流水与被偷菜报告把连续重复内容折叠为一条（流水按 时间+原因+金额 相同、偷菜按 同用户+同作物+同成败，折叠次数 *N 用黄色 #FFC000 表示）；宠物结算超扣转健康抵扣（超出结算前属性值的部分按可调比例用健康抵扣）；自动购买（当时为每日 0:00 懒结算版本，2.0.4 已改为档位触发，见上）；缺货自动购买（默认关闭，使用道具仓库不足自动买足，倍率可调）；商店价格浮动（当时为每小时概率浮动版本，2.0.4 已改为固定时段折扣，见上）；2.0.2：农场商店「全部」指令显示所有商品（默认可购/不可购种子个数 WebUI「设置 → 商店」可调）；打工/玩耍不带参数=策略一（可进行等级最高6种+不可进行等级最低2种升序）、参数为「全部」=策略二全显（个数 WebUI「设置 → 宠物」可调）；宠物属性上限（不同健康值范围内饱食/口渴/心情/体力）WebUI「设置 → 宠物 → 属性」可编辑；后台「打工玩耍」按商店编辑模式拆成打工/玩耍独立编辑页；宠物指令属性条按状态档位变红（第3、4档 #C00000，档位阈值可编辑）；后台多级导航（首页→子页面→编辑页，返回首页/返回上一级、效果相同时只显示返回首页；商店拆为宠物商店（食物/饮料/药物/玩具）与农场商店（种子/化肥）六类独立按钮；设置按子系统分卡、选项卡默认展开，功能开关与数据导入导出并入设置；子页面卡片深浅两态扫描换色+自绘棱角极简扁平图标+全局矩形）；2.0.1：农场经验球改为农场特殊道具（签到按是否开通农场判定、使用时显示农场响应、旧宠物背包经验球自动迁移）、化肥加速信息移到剩余时间/预计收入之下、用户名过长用…截断保证宠物榜信息同排右对齐；自定义参数统一 JSON 驱动（WebUI 设置页编辑、程序按 data.json params 运行）；WebUI 采用校园导览风格（深林绿#1f5f3e+校徽金#d6a11a+米白#f6f4ec、无圆角、OPPOSans+衬线标题）；响应图片去除 Emoji；2.0.0 重构：main.py 按功能拆分为 modules 模块包；农场响应改为纯图片（种植黄/收割红#FFC5C5/开垦·施肥·升级蓝#B4C7E7 高亮 + 农场排行积分 + 盈利变化 + 底部自动化大卡片）；化肥改为按小时购买、按分钟使用，作物按贫瘠土地成熟时间分四级、各级成长阶段 4/5/5/6，化肥按「可加速次数」限制并可快捷施肥；WebUI 可编辑作物等级划分、成长阶段数与化肥可加速次数；签到可编辑内容重做（金币范围/好感度范围/宠物各属性档位结算变化范围/特殊道具获取率，奖池概率自动归一）；1.7.9 新增局域网管理页面开放（可设置访问密码与黑名单、查看访问记录，密码哈希存储、仅本地可改）；1.7.8 数值配置全面改为 WebUI 表格编辑（商店/打工/玩耍/农场商店/贷款套餐，按类别分组、表头常驻、先加载后编辑保护，自动迁移为 game_items.json）
author: sishijiu
version: 2.0.4
