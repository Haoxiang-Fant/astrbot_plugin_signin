name: astrbot_plugin_signin
display_name: 签到娱乐系统
desc: 群签到 + 左轮手枪 + 宠物养成 + 金币银行 + 农场插件：签到/打工/玩耍/商店/存款生息/种植收割/金币红包/活动中心/排行榜，含 WebUI 配置页与后台管理页；2.1.0：新增「自动化 / 自动化帮助」指令（响应 自动购买/自动打工 的指令调用方法：自动化 查看当前自动购买与自动打工状态、打工基准金币、最近自动购买/打工记录，并列出可调用指令；自动化帮助 展示自动购买+自动打工玩法说明；用户开启自动购买自动同步开启自动打工（关联开启）；「结算日志」查看自动购买/打工记录）；自动购买逻辑优化（判定时间改为 自动打工时/每日结算时；触发条件改为 饱食/口渴/心情 任一进入第 3/4 档（健康不参与触发，仅收尾判定）；补充顺序 饱食→口渴→心情，每属性仅在 3/4 档时补；每属性计算「目标 = 满值 − 当前值」并选择效果最接近目标的道具逐次补满（饱食=食物类/口渴=饮料类/心情=玩具类，仓库已有免费优先、不足购买实时价×倍率）；三属性补完后健康 < 40（第一档）才用药物类补健康；购买/使用记录仍带 ×N 数量标记、消耗计入打工基准金币）；自动打工经验收益优化（管理员可在 WebUI「设置 → 宠物 → 自动打工」配置：AUTO_WORK_EXP_ENABLED 是否产生经验（默认关闭 = 只给金币不给经验）、AUTO_WORK_EXP_MULT 经验倍率 0.1~1（默认 0.5 = 手动打工经验的一半）；开启后经验按打工项目经验 × 倍率结算、可正常触发升级）；WebUI 运行记录页改版：宠物记录每行显示两只宠物、虚弱宠物打上红色「停用」标签（自动购买/自动打工暂停执行）；页内顶部新增矩形搜索框（宠物记录按 宠物名/昵称/用户ID、用户信息按 昵称/用户ID 过滤，样式符合校园导览设计体系）；运行记录子页面新增「用户信息」入口（全部用户的基础信息卡片：金币数量/好感等级/宠物等级/农场等级/最后活跃时间，点击卡片展开用户详细信息：好感度/宠物属性/农场土地/自动购买·自动打工状态）；记录用户最后活跃时间（5 分钟内不重复写盘）；固定刷新时间（每天 DAILY_SETTLE_HOUR 默认 0 点固定结算插件数据：全部宠物每日结算+自动购买「每日结算」触发；每天 BANK_SETTLE_HOUR 默认 4 点固定结算银行存款数据：解锁到期存单并发放利息；独立固定结算循环、幂等标记防重复、WebUI「设置 → 固定结算」可调时间与巡检间隔）；自动购买新增触发机制（打开自动购买时立即触发——用户发送「自动购买 开」或管理员在 WebUI 运行记录页开启均清空失败冷却并立即判定补满；结算日志与运行记录展示触发来源：档位触发/开启触发/每日结算/自动打工后/管理员开启）；2.0.4：自动购买重做（原自动喂养）：触发判定改为 饱食/口渴/心情/健康 任一属性进入第 3/4 档时自动触发（2.1.0 已改为 饱食/口渴/心情 且判定时间改为 自动打工时/每日结算时，见上），按 饱食→口渴→心情→健康 顺序补满且道具数量最少化（2.1.0 已改为按类别选最接近目标的道具，见上），购买/使用记录带数量标记（🛒/📦 ×N）；新增自动打工（开启自动购买自动开启，也可「自动打工 开/关」单独控制，未开自动购买不允许开）：自动购买消耗金币记入打工基准金币、自动选择报酬最接近基准的打工项目、只给金币不给经验、报酬溢出计入基准、基准≤100 暂停（下次自动购买超过后恢复）、独立计时器（冷却结束+可调分钟后再安排下一次，循环往复）；商店价格浮动逻辑更改：价格固定偶数点刷新（0/2/4/…/22 整点、同 2 小时窗口稳定）、特价时段（10/12/18/0 时窗口）随机选取 2~5 件商品打 二~八折（倍率 0.2~0.8 可调）、其余时段全部商品回原价、购买按实时价结算、价格变动可在 WebUI「运行记录 → 商店价格」查看；WebUI 新增「运行记录」页（首页新卡片）：宠物记录（全部宠物卡片：当前状态/正在进行的活动/自动购买·自动打工信息与基准，点击开关可直接切换用户自动购买/自动打工）+ 商店价格（最近价格变动记录）；2.0.3：新增「修改昵称 <任意字符>」自定义昵称（90 天有效、优先级高于获取的昵称，各响应统一使用）；金币账单流水与被偷菜报告把连续重复内容折叠为一条（流水按 时间+原因+金额 相同、偷菜按 同用户+同作物+同成败，折叠次数 *N 用黄色 #FFC000 表示）；宠物结算超扣转健康抵扣（超出结算前属性值的部分按可调比例用健康抵扣）；自动购买（当时为每日 0:00 懒结算版本，2.0.4 已改为档位触发，见上）；缺货自动购买（默认关闭，使用道具仓库不足自动买足，倍率可调）；商店价格浮动（当时为每小时概率浮动版本，2.0.4 已改为固定时段折扣，见上）；2.0.2：农场商店「全部」指令显示所有商品（默认可购/不可购种子个数 WebUI「设置 → 商店」可调）；打工/玩耍不带参数=策略一（可进行等级最高6种+不可进行等级最低2种升序）、参数为「全部」=策略二全显（个数 WebUI「设置 → 宠物」可调）；宠物属性上限（不同健康值范围内饱食/口渴/心情/体力）WebUI「设置 → 宠物 → 属性」可编辑；后台「打工玩耍」按商店编辑模式拆成打工/玩耍独立编辑页；宠物指令属性条按状态档位变红（第3、4档 #C00000，档位阈值可编辑）；后台多级导航（首页→子页面→编辑页，返回首页/返回上一级、效果相同时只显示返回首页；商店拆为宠物商店（食物/饮料/药物/玩具）与农场商店（种子/化肥）六类独立按钮；设置按子系统分卡、选项卡默认展开，功能开关与数据导入导出并入设置；子页面卡片深浅两态扫描换色+自绘棱角极简扁平图标+全局矩形）；2.0.1：农场经验球改为农场特殊道具（签到按是否开通农场判定、使用时显示农场响应、旧宠物背包经验球自动迁移）、化肥加速信息移到剩余时间/预计收入之下、用户名过长用…截断保证宠物榜信息同排右对齐；自定义参数统一 JSON 驱动（WebUI 设置页编辑、程序按 data.json params 运行）；WebUI 采用校园导览风格（深林绿#1f5f3e+校徽金#d6a11a+米白#f6f4ec、无圆角、OPPOSans+衬线标题）；响应图片去除 Emoji；2.0.0 重构：main.py 按功能拆分为 modules 模块包；农场响应改为纯图片（种植黄/收割红#FFC5C5/开垦·施肥·升级蓝#B4C7E7 高亮 + 农场排行积分 + 盈利变化 + 底部自动化大卡片）；化肥改为按小时购买、按分钟使用，作物按贫瘠土地成熟时间分四级、各级成长阶段 4/5/5/6，化肥按「可加速次数」限制并可快捷施肥；WebUI 可编辑作物等级划分、成长阶段数与化肥可加速次数；签到可编辑内容重做（金币范围/好感度范围/宠物各属性档位结算变化范围/特殊道具获取率，奖池概率自动归一）；1.7.9 新增局域网管理页面开放（可设置访问密码与黑名单、查看访问记录，密码哈希存储、仅本地可改）；1.7.8 数值配置全面改为 WebUI 表格编辑（商店/打工/玩耍/农场商店/贷款套餐，按类别分组、表头常驻、先加载后编辑保护，自动迁移为 game_items.json）
author: sishijiu
