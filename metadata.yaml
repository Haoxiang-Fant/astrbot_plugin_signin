name: astrbot_plugin_signin
display_name: 签到娱乐系统
desc: 群签到 + 左轮手枪 + 宠物养成 + 金币银行 + 农场插件：签到/打工/玩耍/商店/存款生息/种植收割/金币红包/活动中心/排行榜，含 WebUI 配置页与后台管理页；2.0.0 重构：main.py 按功能拆分为 modules 模块包（签到指令路由留在入口）；农场响应改为纯图片（种植黄/收割红#FFC5C5/开垦·施肥·升级蓝#B4C7E7 高亮 + 农场排行积分 + 盈利变化 + 底部自动化大卡片）；化肥改为按小时购买、按分钟使用，作物按贫瘠土地成熟时间分四级（默认 0-240/241-480/481-720/721-1440）、各级成长阶段 4/5/5/6，化肥按「可加速次数」限制并可快捷施肥（缺化肥名/缺土地编号/缺时间/全缺）；WebUI 可编辑作物等级划分、成长阶段数与化肥可加速次数；签到可编辑内容重做（金币范围/好感度范围/宠物各属性档位结算变化范围/特殊道具获取率，奖池概率自动归一）；1.7.9 新增局域网管理页面开放（可设置访问密码与黑名单、查看访问记录，密码哈希存储、仅本地可改）；1.7.8 数值配置全面改为 WebUI 表格编辑（商店/打工/玩耍/农场商店/贷款套餐，按类别分组、表头常驻、先加载后编辑保护，自动迁移为 game_items.json）
author: sishijiu
version: 2.0.0
